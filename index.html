<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neko 🐾</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-[#121212] text-slate-200 min-h-screen px-6 py-12 md:py-24 selection:bg-purple-500 selection:text-white">

  <main class="max-w-2xl mx-auto space-y-16">

    <section class="space-y-6">
      <h1 class="text-4xl md:text-6xl font-semibold tracking-tight leading-snug">
        Neko 🐾
      </h1>
      
      <p class="text-slate-400 text-base md:text-lg leading-relaxed pt-2">
        Neko's Profile Site
      </p>
    </section>

    <section class="p-6 rounded-2xl bg-white/[0.03] border border-white/5 space-y-4">
      <h2 class="text-xs font-mono text-purple-400 tracking-widest uppercase">LANGUAGES</h2>
      <p class="text-sm font-mono text-slate-300 leading-relaxed">
        Rust / C++ / Java / JavaScript / Node / CSS
      </p>
    </section>

    <section class="space-y-6">
      <h2 class="text-xs font-mono text-slate-500 tracking-widest uppercase">/ REPOSITORIES</h2>
      
      <div class="space-y-6">
        <div class="p-6 rounded-2xl bg-white/[0.02] border border-white/5 hover:border-purple-500/30 transition group">
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-xl font-medium text-slate-100 group-hover:text-purple-300 transition">ClipHistory</h3>
            <span class="text-xs font-mono text-purple-400 bg-purple-500/10 px-2 py-1 rounded">App</span>
          </div>
          <p class="text-sm text-slate-400 font-mono leading-relaxed">
            Press <kbd class="px-1.5 py-0.5 text-xs bg-white/10 rounded border border-white/20 text-slate-200">⌘</kbd> + <kbd class="px-1.5 py-0.5 text-xs bg-white/10 rounded border border-white/20 text-slate-200">B</kbd> to choose and re-copy from your clipboard history
          </p>
        </div>
      </div>
    </section>

    <section class="pt-8 border-t border-white/10 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div class="space-y-1">
        <p class="text-sm font-medium text-slate-300">Contact</p>
        <a href="mailto:neko-hey@protonmail.com" class="text-xs font-mono text-slate-400 hover:text-purple-300 transition">
          neko-hey@protonmail.com
        </a>
      </div>
      <div class="flex space-x-5 text-sm font-mono text-slate-400">
        <a href="https://github.com/Neko-hey" target="_blank" rel="noopener noreferrer" class="hover:text-purple-300 transition">GitHub</a>
      </div>
    </section>

  </main>

</body>
</html>
